<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Texto guía */
.hint {
    position: absolute;
    top: 15%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 20px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%,100% {opacity: 1;}
    50% {opacity: 0.4;}
}

/* Sobre */
.envelope {
    position: relative;
    width: 85vw;
    max-width: 360px;
    height: 60vw;
    max-height: 240px;
    background: #ff6b81;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    transition: transform 0.2s, height 0.6s ease;
}

.envelope:active {
    transform: scale(0.96);
}

/* Tapa */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff4d6d;
    clip-path: polygon(0 0, 50% 50%, 100% 0);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 2;
}

/* Carta */
.letter {
    position: absolute;
    width: 92%;
    height: 92%;
    background: #1e1e2f;
    top: 4%;
    left: 4%;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    transform: translateY(100%);
    transition: transform 1s ease, opacity 0.5s ease;
    border-radius: 15px;
    z-index: 1;

    opacity: 0;
    font-size: 15px;
    overflow-y: auto;
}

/* Scroll */
.letter::-webkit-scrollbar {
    width: 5px;
}
.letter::-webkit-scrollbar-thumb {
    background: #ff6b81;
    border-radius: 10px;
}

/* Estados abiertos */
.envelope.open {
    height: 75vh;
    max-height: 600px;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(0);
    opacity: 1;
}

/* Texto */
h2 {
    margin-top: 0;
    color: #ff6b81;
}

p {
    color: #eee;
    min-height: 120px;
    line-height: 1.5;
}

/* Cursor */
.cursor {
    display: inline-block;
    width: 2px;
    background: #fff;
    margin-left: 3px;
    animation: blinkCursor 1s infinite;
}

@keyframes blinkCursor {
    0%,100% {opacity: 1;}
    50% {opacity: 0;}
}

/* Corazones */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 4s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
    }
}

/* FOTO FINAL */
.foto {
    width: 100%;
    margin-top: 20px;
    border-radius: 15px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1s ease;
}

.foto.mostrar {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div class="hint" id="hint">Toque el sobre mi amorcito UwU 💌</div>

<div class="envelope" onclick="abrirCarta()">
    <div class="flap"></div>

    <div class="letter">
        <h2>Para mi amorcito ❤️</h2>
        <p id="texto"></p><span class="cursor"></span>

        <!-- FOTO -->
        <img src="foto.jpg" alt="foto" class="foto" id="fotoFinal">
    </div>
</div>

<script>
const mensaje = `Feliz cumpleaños mi amorcito 💖

Hoy celebramos que cumple un año más y lo feliz que me hace.
Gracias por cada momento que pasamos juntos mi bebecita 💕. 

Usted es mi persona favorita mi amor.
Y espero que estemos juntos por siempre UwU

La amo muchísimo 💖`;

let i = 0;
let abierta = false;
let corazonesActivos = false;

function crearCorazon() {
    if (!corazonesActivos) return;

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 15 + 15) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}

function escribirTexto() {
    if (i < mensaje.length) {
        const texto = document.getElementById("texto");
        texto.innerHTML += mensaje.charAt(i) === "\n" ? "<br>" : mensaje.charAt(i);
        i++;

        crearCorazon();

        setTimeout(escribirTexto, 35);
    } else {
        corazonesActivos = false;

        // 📸 Mostrar foto al final
        setTimeout(() => {
            document.getElementById("fotoFinal").classList.add("mostrar");
        }, 500);
    }
}

function abrirCarta() {
    if (abierta) return;
    abierta = true;

    document.querySelector(".envelope").classList.add("open");
    document.getElementById("hint").style.display = "none";

    corazonesActivos = true;

    setTimeout(escribirTexto, 700);
}
</script>

</body>
</html>
