<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta para ti ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Texto guía */
.hint {
    position: absolute;
    top: 15%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 20px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%,100% {opacity: 1;}
    50% {opacity: 0.4;}
}

/* Sobre */
.envelope {
    position: relative;
    width: 80vw;
    max-width: 320px;
    height: 55vw;
    max-height: 220px;
    background: #ff6b81;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: transform 0.2s;
}

.envelope:active {
    transform: scale(0.95);
}

/* Tapa */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff4d6d;
    clip-path: polygon(0 0, 50% 50%, 100% 0);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 2;
}

/* Carta */
.letter {
    position: absolute;
    width: 90%;
    height: 90%;
    background: white;
    top: 5%;
    left: 5%;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    transform: translateY(100%);
    transition: transform 1s ease, opacity 0.5s ease;
    border-radius: 10px;
    z-index: 1;

    opacity: 0; /* 🔥 SOLUCIÓN AL BUG */
    font-size: 14px;
    overflow: hidden;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(0);
    opacity: 1;
}

h2 {
    margin-top: 0;
    color: #ff4d6d;
}

p {
    color: #333;
    min-height: 120px;
}

/* Cursor */
.cursor {
    display: inline-block;
    width: 2px;
    background: #333;
    margin-left: 3px;
    animation: blinkCursor 1s infinite;
}

@keyframes blinkCursor {
    0%,100% {opacity: 1;}
    50% {opacity: 0;}
}
</style>
</head>

<body>

<div class="hint" id="hint">Toca el sobre 💌</div>

<div class="envelope" onclick="abrirCarta()">
    <div class="flap"></div>

    <div class="letter">
        <h2>Para ti ❤️</h2>
        <p id="texto"></p><span class="cursor"></span>
    </div>
</div>

<script>
const mensaje = `Feliz cumpleaños mi amor 💖

Hoy celebro lo increíble que eres y lo feliz que me haces.
Gracias por cada momento contigo ✨

Te amo muchísimo 💕`;

let i = 0;
let abierta = false;

function escribirTexto() {
    if (i < mensaje.length) {
        const texto = document.getElementById("texto");
        texto.innerHTML += mensaje.charAt(i) === "\n" ? "<br>" : mensaje.charAt(i);
        i++;
        setTimeout(escribirTexto, 40);
    }
}

function abrirCarta() {
    if (abierta) return;
    abierta = true;

    const sobre = document.querySelector(".envelope");
    sobre.classList.add("open");

    document.getElementById("hint").style.display = "none";

    setTimeout(escribirTexto, 800);
}
</script>

</body>
</html>
